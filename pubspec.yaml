name: stockipa
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^20.1.0
  shared_preferences: 2.3.2
  flutter_secure_storage: ^9.2.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0
  camera: ^0.11.0
  confetti: ^0.7.0
  flutter_native_splash: ^2.4.7
  flutter_tts: ^4.2.5
  image: ^4.8.0
  image_picker: 1.1.2
  google_mlkit_text_recognition: ^0.15.1
  path_provider: ^2.1.4
  path: ^1.9.1
  hive: ^2.2.3
  tflite_flutter: ^0.12.1
  sqflite: ^2.4.4+2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EFF6FF"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_monochrome: "assets/monochrome.png"
  monochrome_icon: "assets/monochrome.png"
flutter:
  uses-material-design: true
  assets:
    - assets/
